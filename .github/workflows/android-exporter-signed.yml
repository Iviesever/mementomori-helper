name: Android exporter protected signing
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-exporter-protected-signing
  cancel-in-progress: false
jobs:
  signed-apk:
    if: github.repository == 'Iviesever/mementomori-helper' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature/android-account-exporter')
    runs-on: windows-2022
    environment: android-release
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require device approval tied to this exact source revision
        shell: pwsh
        env:
          APPROVED_SHA: ${{ vars.DEVICE_VALIDATED_SOURCE_SHA }}
        run: |
          if ($env:APPROVED_SHA -ne '${{ github.sha }}') { throw 'This exact source revision has no recorded device approval in the protected environment.' }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '21'
      - name: Test source before accessing the signing key
        shell: pwsh
        run: |
          dotnet test tests/Exporter.Android.Tests/Exporter.Android.Tests.csproj -c Release -p:NuGetAudit=true -p:NuGetAuditMode=all '-warnaserror:NU1900,NU1901,NU1902,NU1903,NU1904'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Android dependencies without signing secrets
        shell: pwsh
        working-directory: MementoMori.Exporter.Android
        run: |
          dotnet workload install maui-android
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build -t:InstallAndroidDependencies -f net10.0-android "-p:AndroidSdkDirectory=$env:ANDROID_HOME" "-p:JavaSdkDirectory=$env:JAVA_HOME" -p:AcceptAndroidSdkLicenses=True
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build with pinned protected signing identity
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
          DEVICE_VALIDATED_SOURCE_SHA: ${{ vars.DEVICE_VALIDATED_SOURCE_SHA }}
        run: ./tools/release/Publish-SignedAndroid.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: mementomori-exporter-protected-signed-apk
          path: artifacts/signed-android/
          if-no-files-found: error
          retention-days: 14
