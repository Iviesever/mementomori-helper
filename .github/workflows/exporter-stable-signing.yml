name: Exporter protected stable signing

# No PR events or arbitrary source-ref input. Private keys never enter the build job.
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: exporter-stable-signing
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Iviesever/mementomori-helper' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature/android-account-exporter')
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
        working-directory: MementoMori.Exporter.Android
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
      - name: Run no-account regression suite before producing signing input
        working-directory: .
        run: |
          ./tools/release/Test-ApkSigningIdentity.ps1
          dotnet test tests/Exporter.Android.Tests/Exporter.Android.Tests.csproj -c Release --logger "trx;LogFileName=exporter-tests.trx" --results-directory artifacts/test-results "-clp:ErrorsOnly;Summary"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Android toolchain
        run: |
          dotnet workload install maui-android
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build MementoMori.Exporter.Android.csproj -t:InstallAndroidDependencies -f net10.0-android "-p:AndroidSdkDirectory=$env:ANDROID_HOME" "-p:JavaSdkDirectory=$env:JAVA_HOME" -p:AcceptAndroidSdkLicenses=True
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile release without the stable private key
        run: |
          $versionCode = 100000 + [int]'${{ github.run_number }}'
          ../tools/release/Build-AndroidRelease.ps1 -OutputDirectory ../artifacts/signing-input -VersionCode $versionCode
      - name: Audit before signing
        run: ../tools/release/Test-DependencyAudit.ps1 -Project MementoMori.Exporter.Android.csproj -OutputPath ../artifacts/signing-input/dependency-audit.json
      - name: Bind signing input to source, version and package hash
        run: |
          [xml]$project = Get-Content MementoMori.Exporter.Android.csproj -Raw
          @{
            sourceCommit = '${{ github.sha }}'
            workflowRun = '${{ github.run_id }}'
            versionCode = 100000 + [int]'${{ github.run_number }}'
            displayVersion = [string]$project.Project.PropertyGroup[0].ApplicationDisplayVersion
            sha256 = (Get-FileHash ../artifacts/signing-input/input.apk -Algorithm SHA256).Hash
          } | ConvertTo-Json | Set-Content ../artifacts/signing-input/INPUT-INFO.json -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: exporter-stable-signing-input
          path: |
            artifacts/signing-input/input.apk
            artifacts/signing-input/dependency-audit.json
            artifacts/signing-input/INPUT-INFO.json
          retention-days: 1
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exporter-stable-build-validation
          path: artifacts/test-results/
          if-no-files-found: ignore
          retention-days: 14

  sign:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    environment: android-release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require device approval for this exact source revision
        shell: pwsh
        env:
          APPROVED_SHA: ${{ vars.DEVICE_VALIDATED_SOURCE_SHA }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:APPROVED_SHA) -or $env:APPROVED_SHA -ne $env:SOURCE_COMMIT) { throw 'This exact revision has no recorded device approval.' }
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: exporter-stable-signing-input
          path: signing-input
      - name: Validate same-run input provenance before accessing the key
        shell: pwsh
        run: |
          $info = Get-Content signing-input/INPUT-INFO.json -Raw | ConvertFrom-Json
          $hash = (Get-FileHash signing-input/input.apk -Algorithm SHA256).Hash
          if ($info.sourceCommit -ne '${{ github.sha }}' -or $info.workflowRun -ne '${{ github.run_id }}' -or $info.sha256 -ne $hash) { throw 'Signing input provenance mismatch.' }
          if ($info.versionCode -ne (100000 + [int]'${{ github.run_number }}')) { throw 'Signing input version sequence mismatch.' }
      - name: Sign only after environment and exact-source approval
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || vars.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 || vars.ANDROID_CERT_SHA256 }}
          SOURCE_COMMIT: ${{ github.sha }}
          BUILD_COMMIT: ${{ github.sha }}
        run: ./tools/release/Sign-AndroidApk.ps1 -InputApk signing-input/input.apk -OutputDirectory artifacts/signed
      - uses: actions/upload-artifact@v4
        with:
          name: mementomori-exporter-android-arm64-stable-signed
          path: artifacts/signed/
          retention-days: 14
          if-no-files-found: error
