name: Android account exporter (preview)

on:
  push:
    branches: [feature/android-account-exporter, 'codex/android-exporter-*']
  pull_request:
    branches: [master, feature/android-account-exporter]
    paths:
      - 'MementoMori.Exporter.Android/**'
      - 'tests/Exporter.Android.Tests/**'
      - '.github/workflows/android-exporter.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-exporter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      DOTNET_CLI_UI_LANGUAGE: en-US
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
      - name: Contract, storage and sanitization tests (no account needed)
        shell: pwsh
        run: |
          dotnet test tests/Exporter.Android.Tests/Exporter.Android.Tests.csproj -c Release --logger "trx;LogFileName=exporter-tests.trx" --results-directory artifacts/test-results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Android MAUI workload
        shell: pwsh
        run: |
          dotnet workload install maui-android --skip-manifest-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install matching Android SDK dependencies
        shell: pwsh
        run: |
          dotnet build MementoMori.Exporter.Android/MementoMori.Exporter.Android.csproj -t:InstallAndroidDependencies -f net9.0-android "-p:AndroidSdkDirectory=$env:ANDROID_HOME" "-p:JavaSdkDirectory=$env:JAVA_HOME" -p:AcceptAndroidSdkLicenses=True
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build self-contained preview APK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/build-logs -Force | Out-Null
          dotnet build MementoMori.Exporter.Android/MementoMori.Exporter.Android.csproj -c Debug -f net9.0-android -t:SignAndroidPackage -p:RuntimeIdentifier=android-arm64 -p:AndroidKeyStore=false -p:EmbedAssembliesIntoApk=true -p:AndroidUseSharedRuntime=false "-p:JavaSdkDirectory=$env:JAVA_HOME" -p:ApplicationVersion=${{ github.run_number }} "-clp:ErrorsOnly;Summary" -fl "-flp:LogFile=artifacts/build-logs/android-build.log;Verbosity=normal"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $apk = Get-ChildItem MementoMori.Exporter.Android/bin/Debug -Recurse -Filter '*-Signed.apk' | Select-Object -First 1
          if (-not $apk) { throw 'Build did not produce a signed APK.' }
          New-Item -ItemType Directory -Path artifacts/apk -Force | Out-Null
          Copy-Item $apk.FullName artifacts/apk/MementoMori-Exporter-android-arm64-preview.apk
          $hash = Get-FileHash artifacts/apk/MementoMori-Exporter-android-arm64-preview.apk -Algorithm SHA256
          "$($hash.Hash)  MementoMori-Exporter-android-arm64-preview.apk" | Set-Content artifacts/apk/SHA256SUMS.txt -Encoding ascii
          $buildCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @{
            sourceCommit = $env:SOURCE_COMMIT
            buildCommit = $buildCommit
            workflowRun = '${{ github.run_id }}'
            applicationVersion = '${{ github.run_number }}'
            signing = 'ephemeral-development-key'
            architecture = 'android-arm64'
            sha256 = $hash.Hash
          } | ConvertTo-Json | Set-Content artifacts/apk/BUILD-INFO.json -Encoding utf8
      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: mementomori-exporter-android-arm64-preview
          path: artifacts/apk/
          if-no-files-found: error
          retention-days: 14
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-exporter-test-results
          path: artifacts/test-results/
          if-no-files-found: ignore
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-exporter-build-logs
          path: artifacts/build-logs/
          if-no-files-found: ignore
          retention-days: 14
