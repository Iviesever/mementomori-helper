name: Android account exporter (preview)

on:
  push:
    branches: [feature/android-account-exporter]
  pull_request:
    branches: [master, feature/android-account-exporter]
    paths:
      - 'MementoMori.Exporter.Android/**'
      - 'MementoMori.WebUI/**'
      - 'MementoMori/**'
      - 'MementoMori.Common/**'
      - 'MementoMori.Ortega/**'
      - 'MementoMori.BlazorShared/**'
      - 'tests/Exporter.Android.Tests/**'
      - 'tools/release/**'
      - 'global.json'
      - '.github/workflows/android-exporter*.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-exporter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      DOTNET_CLI_UI_LANGUAGE: en-US
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive exact public build source
        shell: pwsh
        run: |
          New-Item -ItemType Directory artifacts/source -Force | Out-Null
          git archive --format=zip -o artifacts/source/source.zip HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rev-parse HEAD | Set-Content artifacts/source/COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: exporter-build-source
          path: artifacts/source/
          retention-days: 7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '21'
      - name: Contract, projection, storage and sanitization tests (no account needed)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/build-logs -Force | Out-Null
          dotnet test tests/Exporter.Android.Tests/Exporter.Android.Tests.csproj -c Release --logger "trx;LogFileName=exporter-tests.trx" --results-directory artifacts/test-results -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=low "-warnaserror:NU1900,NU1901,NU1902,NU1903,NU1904" -fl "-flp:LogFile=artifacts/build-logs/exporter-tests-build.log;Verbosity=normal"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build complete Windows desktop WebUI project
        shell: pwsh
        run: |
          dotnet build MementoMori.WebUI/MementoMori.WebUI.csproj -c Release -p:NuGetAudit=true -p:NuGetAuditMode=all "-warnaserror:NU1900,NU1901,NU1902,NU1903,NU1904" "-clp:ErrorsOnly;Summary" -fl "-flp:LogFile=artifacts/build-logs/desktop-build.log;Verbosity=normal"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Signing input validation with disposable synthetic key
        shell: pwsh
        run: ./tools/release/Test-SigningPreflight.ps1
      - name: Publish Windows self-contained distribution
        shell: pwsh
        run: ./tools/release/Package-Windows.ps1
      - name: Test shipped Windows launcher without a game account
        shell: pwsh
        run: ./tools/release/Test-WindowsPackage.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: mementomori-exporter-windows-x64-preview
          path: artifacts/windows/MementoMori-Exporter-win-x64-preview.zip
          if-no-files-found: error
          retention-days: 14
      - name: Install supported Android MAUI workload
        shell: pwsh
        working-directory: MementoMori.Exporter.Android
        run: |
          dotnet workload install maui-android
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install matching Android SDK dependencies
        shell: pwsh
        working-directory: MementoMori.Exporter.Android
        run: |
          dotnet build -t:InstallAndroidDependencies -f net10.0-android "-p:AndroidSdkDirectory=$env:ANDROID_HOME" "-p:JavaSdkDirectory=$env:JAVA_HOME" -p:AcceptAndroidSdkLicenses=True
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build self-contained preview APK
        shell: pwsh
        working-directory: MementoMori.Exporter.Android
        run: |
          dotnet build -c Debug -f net10.0-android -t:SignAndroidPackage -p:RuntimeIdentifier=android-arm64 -p:AndroidKeyStore=false -p:EmbedAssembliesIntoApk=true "-p:JavaSdkDirectory=$env:JAVA_HOME" -p:NuGetAudit=true -p:NuGetAuditMode=all "-warnaserror:NU1900,NU1901,NU1902,NU1903,NU1904" "-clp:ErrorsOnly;Summary" -fl "-flp:LogFile=../artifacts/build-logs/android-build.log;Verbosity=normal"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $apk = @(Get-ChildItem bin/Debug -Recurse -Filter '*-Signed.apk')
          if ($apk.Count -ne 1) { throw 'Expected exactly one signed APK.' }
          New-Item -ItemType Directory ../artifacts/apk -Force | Out-Null
          Copy-Item $apk[0].FullName ../artifacts/apk/MementoMori-Exporter-android-arm64-preview.apk
          $hash = Get-FileHash ../artifacts/apk/MementoMori-Exporter-android-arm64-preview.apk -Algorithm SHA256
          "$($hash.Hash)  MementoMori-Exporter-android-arm64-preview.apk" | Set-Content ../artifacts/apk/SHA256SUMS.txt -Encoding ascii
          $buildCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $project = [xml](Get-Content MementoMori.Exporter.Android.csproj -Raw)
          @{
            sourceCommit = $env:SOURCE_COMMIT
            buildCommit = $buildCommit
            workflowRun = '${{ github.run_id }}'
            applicationVersion = $project.SelectSingleNode('/Project/PropertyGroup/ApplicationVersion').InnerText
            applicationDisplayVersion = $project.SelectSingleNode('/Project/PropertyGroup/ApplicationDisplayVersion').InnerText
            signing = 'ephemeral-development-key-NOT-UPDATE-COMPATIBLE'
            architecture = 'android-arm64'
            sha256 = $hash.Hash
          } | ConvertTo-Json | Set-Content ../artifacts/apk/BUILD-INFO.json -Encoding utf8
      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: mementomori-exporter-android-arm64-preview
          path: artifacts/apk/
          if-no-files-found: error
          retention-days: 14
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-exporter-test-results
          path: artifacts/test-results/
          if-no-files-found: ignore
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-exporter-build-logs
          path: artifacts/build-logs/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload runtime validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exporter-runtime-validation
          path: artifacts/validation/
          if-no-files-found: ignore
          retention-days: 14
